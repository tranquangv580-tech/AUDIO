<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Trình Phát Audio - Thư Viện Sách Nói</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            
            /* Dark Theme - Mặc định (Cơ bản) */
            --bg-gradient-dark: linear-gradient(135deg, #020617 0%, #090d1a 50%, #0f172a 100%);
            --bg-fallback-dark: #020617;
            --card-bg-dark: rgba(15, 23, 42, 0.85);
            --card-border-dark: rgba(255, 255, 255, 0.08);
            --card-hover-dark: rgba(30, 41, 59, 0.95);
            --text-primary-dark: #f8fafc;
            --text-secondary-dark: #94a3b8;
            --accent-color-dark: #f43f5e;
            --accent-light-dark: rgba(244, 63, 94, 0.2);
            
            /* Light Theme */
            --bg-gradient-light: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #faf5ff 100%);
            --bg-fallback-light: #f0f9ff;
            --card-bg-light: rgba(255, 255, 255, 0.85);
            --card-border-light: rgba(226, 232, 240, 0.9);
            --card-hover-light: rgba(255, 255, 255, 1);
            --text-primary-light: #0f172a;
            --text-secondary-light: #64748b;
            --accent-color-light: #e11d48;
            --accent-light-light: rgba(225, 29, 72, 0.12);
        }

        /* Phong cách: Tinh Vân (Nebula) - Tím tối huyền bí, nhiều tinh vân */
        body.theme-style-nebula {
            --bg-gradient: linear-gradient(135deg, #0f051d 0%, #1e0b36 40%, #110224 80%, #05010a 100%);
            --bg-fallback: #0f051d;
            --accent: #d946ef;
            --accent-bg: rgba(217, 70, 239, 0.25);
        }

        /* Phong cách: Đại Dương Ban Đêm (Midnight Ocean) */
        body.theme-style-ocean {
            --bg-gradient: linear-gradient(135deg, #02233f 0%, #03345c 50%, #0c4a6e 100%);
            --bg-fallback: #02233f;
            --accent: #38bdf8;
            --accent-bg: rgba(56, 189, 248, 0.2);
        }

        body {
            --bg-gradient: var(--bg-gradient-dark);
            --bg-fallback: var(--bg-fallback-dark);
            --card-bg: var(--card-bg-dark);
            --card-border: var(--card-border-dark);
            --card-hover: var(--card-hover-dark);
            --text-primary: var(--text-primary-dark);
            --text-secondary: var(--text-secondary-dark);
            --accent: var(--accent-color-dark);
            --accent-bg: var(--accent-light-dark);
            --shadow-color: rgba(0, 0, 0, 0.5);
            user-select: none;
            -webkit-user-select: none;
        }

        body.light-theme {
            --bg-gradient: var(--bg-gradient-light);
            --bg-fallback: var(--bg-fallback-light);
            --card-bg: var(--card-bg-light);
            --card-border: var(--card-border-light);
            --card-hover: var(--card-hover-light);
            --text-primary: var(--text-primary-light);
            --text-secondary: var(--text-secondary-light);
            --accent: var(--accent-color-light);
            --accent-light: var(--accent-light-light);
            --shadow-color: rgba(148, 163, 184, 0.25);
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.35s ease, border-color 0.35s ease, color 0.35s ease;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            background-color: var(--bg-fallback);
            color: var(--text-primary);
            font-family: var(--font-main);
            margin: 0;
            padding: max(16px, env(safe-area-inset-top)) 16px max(30px, env(safe-area-inset-bottom));
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Hiệu ứng tinh vân vũ trụ u tối chi tiết */
        .nebula-decorations {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: -1; overflow: hidden; display: none;
        }
        body.theme-style-nebula .nebula-decorations { display: block; }
        .nebula-cloud-1 {
            position: absolute; top: -10%; left: -10%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, rgba(88, 28, 135, 0.1) 50%, transparent 70%);
            border-radius: 50%; filter: blur(40px);
        }
        .nebula-cloud-2 {
            position: absolute; bottom: 10%; right: -20%; width: 70vw; height: 70vw;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.2) 0%, rgba(126, 34, 206, 0.1) 60%, transparent 80%);
            border-radius: 50%; filter: blur(50px);
        }
        .nebula-stars {
            position: absolute; inset: 0;
            background-image: 
                radial-gradient(1.5px 1.5px at 15px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 150px, #f472b6, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 220px 80px, #c084fc, rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 350px 280px, #e879f9, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 400px 100px, #ffffff, rgba(0,0,0,0));
            background-size: 450px 450px; opacity: 0.85;
        }

        .app-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 16px; z-index: 10;
        }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn {
            width: 42px; height: 42px; border-radius: 13px; border: 1px solid var(--card-border);
            background: var(--card-bg); backdrop-filter: blur(12px); color: var(--text-primary);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow-color); text-decoration: none; flex-shrink: 0;
        }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        .icon-btn.active-custom { background: var(--accent); color: #fff; border-color: var(--accent); }

        .style-select {
            background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-primary);
            padding: 8px 12px; border-radius: 13px; font-size: 12px; font-weight: 700;
            font-family: var(--font-main); outline: none; cursor: pointer; box-shadow: 0 4px 12px var(--shadow-color);
        }

        /* Bảng điều khiển tinh chỉnh phần tử (Hiện ra khi bật customizer thay cho các nút theme) */
        .layout-control-panel {
            display: none;
            position: fixed;
            bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--accent);
            padding: 12px 16px;
            border-radius: 20px;
            z-index: 1050;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            align-items: center;
            gap: 12px;
            animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        body.customizing-layout .layout-control-panel { display: flex; }
        body.customizing-layout .style-select,
        body.customizing-layout #themeToggleBtn { display: none !important; }

        .control-group-title {
            font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-right: 4px;
        }
        .control-action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            width: 34px; height: 34px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700; cursor: pointer;
        }
        .control-action-btn:active { background: var(--accent); color: #fff; transform: scale(0.9); }

        /* Hiệu ứng chọn phần tử khi customizer bật */
        body.customizing-layout .player-module,
        body.customizing-layout .player-cover-container,
        body.customizing-layout .feature-item-btn,
        body.customizing-layout .controls-row {
            cursor: pointer;
            transition: outline 0.2s ease;
        }
        body.customizing-layout .player-module.selected-element,
        body.customizing-layout .selected-sub-element {
            outline: 3px solid var(--accent) !important;
            border-radius: 12px;
        }

        .sleep-timer-badge {
            display: none; align-items: center; justify-content: center; gap: 6px;
            background: var(--accent-bg); border: 1px solid var(--accent); color: var(--accent);
            padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 800;
            margin: 0 auto 12px auto; width: fit-content; box-shadow: 0 4px 12px var(--shadow-color);
        }

        .history-banner {
            display: none; align-items: center; justify-content: space-between;
            background: var(--card-bg); border: 1px solid var(--accent); padding: 10px 14px;
            border-radius: 14px; margin-bottom: 14px; font-size: 12px; font-weight: 700;
            box-shadow: 0 6px 20px var(--shadow-color); cursor: pointer;
        }
        .history-banner:hover { background: var(--card-hover); }

        .player-container-flex { display: flex; flex-direction: column; gap: 16px; flex: 1; }

        .player-top-section { display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; transition: transform 0.2s ease; }
        .player-cover-container {
            width: 150px; height: 210px; border-radius: 18px; overflow: hidden;
            box-shadow: 0 10px 25px var(--shadow-color); border: 1px solid var(--card-border);
            margin-bottom: 12px; background: rgba(0,0,0,0.2); transition: transform 0.2s ease;
        }
        .player-cover { width: 100%; height: 100%; object-fit: cover; }
        .player-story-title { font-size: 16px; font-weight: 800; margin: 0 0 4px 0; color: var(--text-primary); }
        .player-episode-title { font-size: 13px; font-weight: 700; color: var(--accent); margin: 0; }

        .player-bottom-section {
            background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border); border-radius: 28px; padding: 18px;
            box-shadow: 0 8px 32px var(--shadow-color); margin-top: auto; position: relative; transition: transform 0.2s ease;
        }

        /* Thanh tiến trình có dải màu phủ tới nút tròn */
        .progress-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(to right, var(--accent) 0%, var(--card-border) 0%);
            height: 10px;
            border-radius: 5px;
            outline: none;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid var(--accent);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .time-info-row {
            display: flex; justify-content: space-between; font-size: 12px; font-weight: 700;
            color: var(--text-secondary); margin-bottom: 16px;
        }

        .controls-row { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 18px; transition: transform 0.2s ease; }
        .control-btn {
            background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-primary);
            width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; cursor: pointer; box-shadow: 0 4px 12px var(--shadow-color);
        }
        .control-btn:active { transform: scale(0.92); }
        .control-btn svg { width: 20px; height: 20px; fill: currentColor; stroke: currentColor; stroke-width: 1.5; }

        .play-pause-btn {
            background: var(--accent); color: #fff; border: none; width: 60px; height: 60px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 6px 20px var(--accent-bg);
        }
        .play-pause-btn:active { transform: scale(0.92); }
        .play-pause-btn svg { width: 26px; height: 26px; fill: currentColor; }

        .features-row {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            border-top: 1px solid var(--card-border); padding-top: 14px; transition: transform 0.2s ease;
        }
        .feature-item-btn {
            background: rgba(0,0,0,0.1); border: 1px solid var(--card-border); color: var(--text-primary);
            padding: 10px 6px; border-radius: 14px; font-size: 11px; font-weight: 700;
            font-family: var(--font-main); cursor: pointer; display: flex; flex-direction: column;
            align-items: center; gap: 4px; text-align: center;
        }
        .feature-item-btn:hover { background: var(--card-hover); border-color: var(--accent); }
        .feature-item-btn svg { width: 16px; height: 16px; stroke: var(--accent); fill: none; stroke-width: 2; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(6px);
            z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }

        .bottom-sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%; background: var(--bg-gradient);
            border-radius: 24px 24px 0 0; padding: 20px 16px max(30px, env(safe-area-inset-bottom));
            box-sizing: border-box; z-index: 1001; transition: bottom 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 80vh; overflow-y: auto; border-top: 1px solid var(--card-border);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5); max-width: 480px; left: 50%; transform: translateX(-50%);
        }
        .bottom-sheet.active { bottom: 0; }

        .sheet-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--card-border);
        }
        .sheet-title { font-size: 15px; font-weight: 800; margin: 0; color: var(--text-primary); }
        .close-btn { background: transparent; border: none; color: var(--text-secondary); font-size: 22px; cursor: pointer; padding: 0; }

        .sheet-option-btn {
            width: 100%; background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text-primary); padding: 12px; border-radius: 12px; font-size: 13px;
            font-weight: 700; cursor: pointer; margin-bottom: 8px; text-align: left;
        }
        .sheet-option-btn:hover, .sheet-option-btn.active { border-color: var(--accent); background: var(--card-hover); color: var(--accent); }

        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 6px; }
        .form-input {
            width: 100%; background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text-primary); padding: 12px; border-radius: 12px; font-size: 13px;
            font-family: var(--font-main); outline: none;
        }

        .submit-btn {
            width: 100%; background: var(--accent); color: #ffffff; border: none;
            padding: 13px; border-radius: 12px; font-size: 14px; font-weight: 700;
            font-family: var(--font-main); cursor: pointer; margin-top: 6px;
        }

        .episode-list-item {
            padding: 12px; background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 12px; margin-bottom: 8px; cursor: pointer; font-size: 13px; font-weight: 700;
            display: flex; justify-content: space-between; align-items: center; color: var(--text-primary);
        }
        .episode-list-item.playing { border-color: var(--accent); color: var(--accent); background: var(--card-hover); }

        #toast-container {
            position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
            z-index: 2000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; width: 90%; max-width: 360px; align-items: center;
        }
        .custom-toast {
            background: var(--card-bg); backdrop-filter: blur(16px); color: var(--text-primary);
            padding: 10px 18px; border-radius: 30px; font-size: 12px; font-weight: 600;
            box-shadow: 0 6px 20px var(--shadow-color); opacity: 0; transform: translateY(15px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid var(--card-border); text-align: center;
        }
        .custom-toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <!-- Hiệu ứng không gian tinh vân -->
    <div class="nebula-decorations">
        <div class="nebula-cloud-1"></div>
        <div class="nebula-cloud-2"></div>
        <div class="nebula-stars"></div>
    </div>

    <!-- Bảng điều khiển tinh chỉnh phần tử nổi khi ở chế độ chỉnh sửa -->
    <div class="layout-control-panel" id="layoutControlPanel">
        <span class="control-group-title" id="selectedElementName">Chưa chọn ô</span>
        <div style="display: flex; gap: 6px;">
            <button class="control-action-btn" onclick="adjustSelectedElement('up')" title="Nhích lên">⬆</button>
            <button class="control-action-btn" onclick="adjustSelectedElement('down')" title="Nhích xuống">⬇</button>
            <button class="control-action-btn" onclick="adjustSelectedElement('zoomIn')" title="Phóng to">➕</button>
            <button class="control-action-btn" onclick="adjustSelectedElement('zoomOut')" title="Thu nhỏ">➖</button>
        </div>
        <button class="submit-btn" style="margin-top: 0; padding: 6px 12px; font-size: 12px; width: auto;" onclick="toggleLayoutCustomizer()">Xong</button>
    </div>

    <div class="app-header">
        <a href="detail.html" class="icon-btn" title="Quay lại chi tiết">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="header-actions">
            <!-- Nút chức năng Nhạc Nền mới -->
            <button class="icon-btn" onclick="openBgMusicModal()" title="Cài đặt nhạc nền">
                <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </button>
            <!-- Nút bật chế độ Cài đặt giao diện tinh chỉnh -->
            <button class="icon-btn" id="layoutToggleBtn" onclick="toggleLayoutCustomizer()" title="Tùy chỉnh phần tử giao diện">
                <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </button>
            <select class="style-select" id="themeStyleSelect" onchange="changeThemeStyle(this.value)" title="Chọn phong cách giao diện">
                <option value="default">✨ Cơ bản</option>
                <option value="nebula">🌌 Tinh vân</option>
                <option value="ocean">🌊 Đại dương đêm</option>
            </select>
            <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Đổi giao diện Ngày / Đêm">
                <svg id="themeIconMoon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg id="themeIconSun" viewBox="0 0 24 24" style="display: none;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
        </div>
    </div>

    <!-- Khung đếm ngược hẹn giờ nhỏ xinh ở trên cùng -->
    <div class="sleep-timer-badge" id="sleepTimerBadge">
        <span>⏳ Hẹn giờ tắt:</span>
        <span id="sleepCountdownText">0:00:00</span>
    </div>

    <!-- Thông báo lịch sử nghe trước đó -->
    <div class="history-banner" id="historyBanner" onclick="jumpToHistoryTime()">
        <span id="historyBannerText">📜 Có lịch sử nghe trước đó. Bấm vào để tiếp tục!</span>
        <span style="color: var(--accent); font-weight: 850;">Nhảy tới ▶</span>
    </div>

    <!-- Khung chính -->
    <div class="player-container-flex" id="playerContainerFlex">
        
        <!-- Module 1: Ảnh bìa & Tên -->
        <div class="player-top-section player-module" id="moduleCoverTitle" data-name="Khối Ảnh & Tên">
            <div class="player-cover-container" id="subElementCover" data-name="Ảnh bìa">
                <img src="" alt="Ảnh bìa" class="player-cover" id="playerCoverImg">
            </div>
            <h2 class="player-story-title" id="playerStoryTitle">Đang tải tên truyện...</h2>
            <p class="player-episode-title" id="playerEpisodeTitle">Đang tải tập...</p>
        </div>

        <!-- Module 2: Điều khiển & Tiến trình -->
        <div class="player-bottom-section player-module" id="moduleControls" data-name="Khối Điều Khiển">
            <!-- Thanh tiến trình có dải màu phủ tới nút tròn -->
            <input type="range" class="progress-slider" id="progressSlider" min="0" max="100" value="0" step="0.1" oninput="onSliderInput(this.value)" onchange="onSliderChange(this.value)">
            
            <div class="time-info-row">
                <span id="currentTimeText">0:00:00</span>
                <span id="durationText">0:00:00</span>
            </div>

            <div class="controls-row" id="subElementControls" data-name="Cụm Nút Phát">
                <button class="control-btn" onclick="skipTime(-10)" title="Lùi 10 giây">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
                </button>
                <button class="play-pause-btn" onclick="togglePlayPause()" id="playPauseMainBtn">
                    <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                </button>
                <button class="control-btn" onclick="skipTime(10)" title="Tới 10 giây">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>
                </button>
            </div>

            <div class="features-row" id="subElementFeatures" data-name="Hàng Tiện Ích">
                <button class="feature-item-btn" onclick="openSpeedModal()">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span id="speedLabelBtn">Tốc độ: 1.0x</span>
                </button>
                <button class="feature-item-btn" onclick="openSleepTimerModal()">
                    <svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
                    <span>Hẹn giờ tắt</span>
                </button>
                <button class="feature-item-btn" onclick="openPlaylistModal()">
                    <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    <span>Danh sách tập</span>
                </button>
            </div>
        </div>

    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeAllModals()"></div>

    <!-- Modal Nhạc Nền (Background Music) -->
    <div class="bottom-sheet" id="bgMusicModalSheet">
        <div class="sheet-header">
            <h3 class="sheet-title">Quản Lý Nhạc Nền Phát Kèm</h3>
            <button class="close-btn" onclick="closeAllModals()">&times;</button>
        </div>
        
        <div class="form-group">
            <label class="form-label">Thêm nhạc nền mới (MP3)</label>
            <div style="display: flex; gap: 8px; align-items: center;">
                <input type="text" class="form-input" id="bgMusicNameInput" placeholder="Tên nhạc nền...">
                <input type="file" id="bgMusicFileInput" accept="audio/mp3, audio/*" style="display: none;" onchange="handleBgMusicFileSelected(this)">
                <button class="submit-btn" style="margin-top: 0; width: 130px;" onclick="document.getElementById('bgMusicFileInput').click()">📁 Chọn tệp</button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Âm lượng nhạc nền (<span id="bgVolumeVal">50</span>%)</label>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="range" min="0" max="100" value="50" class="progress-slider" id="bgVolumeRange" oninput="updateBgVolumePreview(this.value)">
                <button class="submit-btn" style="margin-top: 0; width: 110px; background: var(--card-bg); border: 1px solid var(--accent); color: var(--accent);" onclick="toggleBgMusicPreview()" id="bgPreviewBtn">▶ Nghe thử</button>
            </div>
        </div>

        <div class="form-group" style="margin-top: 10px;">
            <label class="form-label">Danh sách nhạc nền</label>
            <div id="bgMusicListContainer" style="max-height: 35vh; overflow-y: auto;">
                <!-- Danh sách load từ JS -->
            </div>
        </div>

        <button class="submit-btn" onclick="closeAllModals()">Xong</button>
    </div>

    <!-- Modal Tốc Độ -->
    <div class="bottom-sheet" id="speedModalSheet">
        <div class="sheet-header">
            <h3 class="sheet-title">Tốc Độ Phát Audio (Áp dụng toàn cục)</h3>
            <button class="close-btn" onclick="closeAllModals()">&times;</button>
        </div>
        <button class="sheet-option-btn" onclick="setPlaybackSpeed(0.75)">0.75x - Chậm</button>
        <button class="sheet-option-btn" onclick="setPlaybackSpeed(1.0)">1.0x - Chuẩn</button>
        <button class="sheet-option-btn" onclick="setPlaybackSpeed(1.25)">1.25x - Hơi nhanh</button>
        <button class="sheet-option-btn" onclick="setPlaybackSpeed(1.5)">1.5x - Nhanh</button>
        <button class="sheet-option-btn" onclick="setPlaybackSpeed(2.0)">2.0x - Siêu tốc</button>
        <div class="form-group" style="margin-top: 12px;">
            <label class="form-label">Tốc độ tùy chỉnh (0.5 - 4.0)</label>
            <div style="display: flex; gap: 8px;">
                <input type="number" step="0.1" min="0.5" max="4.0" class="form-input" id="customSpeedInput" placeholder="Nhập tốc độ...">
                <button class="submit-btn" style="margin-top: 0; width: 100px;" onclick="applyCustomSpeed()">Áp dụng</button>
            </div>
        </div>
    </div>

    <!-- Modal Hẹn Giờ Tắt -->
    <div class="bottom-sheet" id="sleepTimerSheet">
        <div class="sheet-header">
            <h3 class="sheet-title">Hẹn Giờ Tắt Audio</h3>
            <button class="close-btn" onclick="closeAllModals()">&times;</button>
        </div>
        <button class="sheet-option-btn" onclick="startSleepTimer(5)">Sau 5 phút</button>
        <button class="sheet-option-btn" onclick="startSleepTimer(15)">Sau 15 phút</button>
        <button class="sheet-option-btn" onclick="startSleepTimer(30)">Sau 30 phút</button>
        <button class="sheet-option-btn" onclick="startSleepTimer(60)">Sau 60 phút</button>
        <div class="form-group" style="margin-top: 12px;">
            <label class="form-label">Hoặc nhập số phút tùy chỉnh</label>
            <div style="display: flex; gap: 8px;">
                <input type="number" min="1" class="form-input" id="customMinutesInput" placeholder="Số phút...">
                <button class="submit-btn" style="margin-top: 0; width: 100px;" onclick="applyCustomSleepTimer()">Bắt đầu</button>
            </div>
        </div>
        <button class="submit-btn" style="background: rgba(244,63,94,0.2); color: var(--accent); margin-top: 10px;" onclick="cancelSleepTimer()">Hủy hẹn giờ</button>
    </div>

    <!-- Modal Danh Sách Tập -->
    <div class="bottom-sheet" id="playlistSheet">
        <div class="sheet-header">
            <h3 class="sheet-title">Danh Sách Tập Audio</h3>
            <button class="close-btn" onclick="closeAllModals()">&times;</button>
        </div>
        <div id="playlistContainer" style="max-height: 50vh; overflow-y: auto;"></div>
    </div>

    <div id="toast-container"></div>

    <script>
        function initTheme() {
            const savedTheme = localStorage.getItem('appTheme') || 'dark';
            const savedStyle = localStorage.getItem('appThemeStyle') || 'nebula'; // Mặc định Tinh vân

            document.getElementById('themeStyleSelect').value = savedStyle;
            applyThemeStyle(savedStyle);

            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                document.getElementById('themeIconMoon').style.display = 'none';
                document.getElementById('themeIconSun').style.display = 'block';
            } else {
                document.body.classList.remove('light-theme');
                document.getElementById('themeIconMoon').style.display = 'block';
                document.getElementById('themeIconSun').style.display = 'none';
            }
        }

        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-theme');
            localStorage.setItem('appTheme', isLight ? 'light' : 'dark');
            document.getElementById('themeIconMoon').style.display = isLight ? 'none' : 'block';
            document.getElementById('themeIconSun').style.display = isLight ? 'block' : 'none';
            showToast(isLight ? 'Chế độ Ban Ngày ☀️' : 'Chế độ Ban Đêm 🌙');
        }

        function changeThemeStyle(style) {
            localStorage.setItem('appThemeStyle', style);
            applyThemeStyle(style);
            showToast(`Đã đổi phong cách: ${style === 'nebula' ? 'Tinh vân 🌌' : style === 'ocean' ? 'Đại dương đêm 🌊' : 'Cơ bản ✨'}`);
        }

        function applyThemeStyle(style) {
            document.body.classList.remove('theme-style-nebula', 'theme-style-ocean');
            if (style === 'nebula') {
                document.body.classList.add('theme-style-nebula');
            } else if (style === 'ocean') {
                document.body.classList.add('theme-style-ocean');
            }
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'custom-toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('show'); }, 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function openDB(dbName = 'AudioBookDB_Files') {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onupgradeneeded = e => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('audioBlobs')) db.createObjectStore('audioBlobs');
                };
                request.onsuccess = e => resolve(e.target.result);
                request.onerror = e => reject(e.target.error);
            });
        }

        const STORIES_KEY = 'audio_book_stories_v2';
        let currentStoryId = localStorage.getItem('currentStoryId');
        let currentEpisodeIndex = parseInt(localStorage.getItem('currentEpisodeIndex') || '0', 10);
        let currentStory = null;

        let audioElement = new Audio();
        let bgAudioElement = new Audio();
        bgAudioElement.loop = true; // Hết nhạc nền tự động phát lại từ đầu

        let currentPlaybackSpeed = parseFloat(localStorage.getItem('globalAudioSpeed') || '1.0');
        let sleepTimerInterval = null;
        let sleepTimerRemainingSeconds = 0;
        let pendingHistoryTime = 0;
        let isUserSeeking = false;

        // Quản lý Nhạc nền
        let bgMusicList = JSON.parse(localStorage.getItem('customBgMusicList') || '[]');
        let activeBgMusicId = localStorage.getItem('activeBgMusicId') || '';
        let bgMusicVolume = parseFloat(localStorage.getItem('bgMusicVolume') || '0.5');

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadElementTransforms();

            bgAudioElement.volume = bgMusicVolume;
            document.getElementById('bgVolumeRange').value = bgMusicVolume * 100;
            document.getElementById('bgVolumeVal').textContent = Math.round(bgMusicVolume * 100);

            audioElement.playbackRate = currentPlaybackSpeed;
            document.getElementById('speedLabelBtn').textContent = `Tốc độ: ${currentPlaybackSpeed}x`;

            loadStoryAndPlay();

            // Cập nhật liên tục thanh tiến trình và dải màu đã phát
            audioElement.addEventListener('timeupdate', () => {
                if (audioElement.duration && !isUserSeeking) {
                    const slider = document.getElementById('progressSlider');
                    const pct = (audioElement.currentTime / audioElement.duration) * 100;
                    slider.value = pct;
                    updateSliderFill(pct);
                    document.getElementById('currentTimeText').textContent = formatTime(audioElement.currentTime);
                    document.getElementById('durationText').textContent = formatTime(audioElement.duration);

                    savePlaybackHistory(audioElement.currentTime);
                }
            });

            audioElement.addEventListener('play', () => {
                playActiveBgMusic();
            });

            audioElement.addEventListener('pause', () => {
                bgAudioElement.pause();
            });

            audioElement.addEventListener('ended', () => {
                savePlaybackHistory(0);
                bgAudioElement.pause();
                if (currentStory && currentStory.episodes && currentEpisodeIndex < currentStory.episodes.length - 1) {
                    currentEpisodeIndex++;
                    localStorage.setItem('currentEpisodeIndex', currentEpisodeIndex);
                    loadAndPlayCurrentEpisode();
                    showToast('Đang tự động chuyển sang tập tiếp theo...');
                } else {
                    document.getElementById('playIcon').style.display = 'block';
                    document.getElementById('pauseIcon').style.display = 'none';
                    showToast('Đã phát hết danh sách tập audio!');
                }
            });
        });

        // Xử lý phát nhạc nền
        async function playActiveBgMusic() {
            if (!activeBgMusicId) return;
            const track = bgMusicList.find(t => t.id === activeBgMusicId);
            if (!track) return;

            try {
                const db = await openDB('AudioBookDB_BgMusic');
                const tx = db.transaction('audioBlobs', 'readonly');
                const store = tx.objectStore('audioBlobs');
                const req = store.get(track.fileId);

                req.onsuccess = function(e) {
                    const blob = e.target.result;
                    if (blob) {
                        const url = URL.createObjectURL(blob);
                        if (bgAudioElement.src !== url) {
                            bgAudioElement.src = url;
                        }
                        bgAudioElement.volume = bgMusicVolume;
                        bgAudioElement.play().catch(err => console.log('BgMusic play prevented:', err));
                    }
                };
            } catch (err) {
                console.error(err);
            }
        }

        function openBgMusicModal() {
            closeAllModals();
            renderBgMusicList();
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('bgMusicModalSheet').classList.add('active');
        }

        function renderBgMusicList() {
            const container = document.getElementById('bgMusicListContainer');
            let html = `
                <div class="episode-list-item ${!activeBgMusicId ? 'playing' : ''}" onclick="selectBgMusic('')">
                    <span>🚫 Không có nhạc nền</span>
                    <span>${!activeBgMusicId ? '✓' : ''}</span>
                </div>
            `;

            html += bgMusicList.map(item => `
                <div class="episode-list-item ${activeBgMusicId === item.id ? 'playing' : ''}">
                    <span onclick="selectBgMusic('${item.id}')">${escapeHtml(item.name)}</span>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <span onclick="selectBgMusic('${item.id}')" style="font-size: 11px;">${activeBgMusicId === item.id ? 'Đang chọn' : 'Chọn'}</span>
                        <button onclick="deleteBgMusic('${item.id}')" style="background: transparent; border: none; color: var(--accent); cursor: pointer; font-size: 14px;" title="Xóa">🗑️</button>
                    </div>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        async function handleBgMusicFileSelected(input) {
            const file = input.files[0];
            if (!file) return;

            const nameInput = document.getElementById('bgMusicNameInput');
            const musicName = nameInput.value.trim() || file.name.replace(/\.[^/.]+$/, "");
            const fileId = 'bg_' + Date.now();

            try {
                const db = await openDB('AudioBookDB_BgMusic');
                const tx = db.transaction('audioBlobs', 'readwrite');
                const store = tx.objectStore('audioBlobs');
                store.put(file, fileId);

                tx.oncomplete = () => {
                    bgMusicList.push({ id: fileId, name: musicName });
                    localStorage.setItem('customBgMusicList', JSON.stringify(bgMusicList));
                    if (!activeBgMusicId) {
                        selectBgMusic(fileId);
                    }
                    nameInput.value = '';
                    input.value = '';
                    renderBgMusicList();
                    showToast(`Đã thêm nhạc nền: ${musicName}`);
                };
            } catch (err) {
                console.error(err);
                showToast('Lỗi lưu tệp nhạc nền!');
            }
        }

        function selectBgMusic(id) {
            activeBgMusicId = id;
            localStorage.setItem('activeBgMusicId', id);
            renderBgMusicList();
            if (id) {
                playActiveBgMusic();
                showToast('Đã bật nhạc nền!');
            } else {
                bgAudioElement.pause();
                showToast('Đã tắt nhạc nền');
            }
        }

        async function deleteBgMusic(id) {
            bgMusicList = bgMusicList.filter(t => t.id !== id);
            localStorage.setItem('customBgMusicList', JSON.stringify(bgMusicList));
            if (activeBgMusicId === id) {
                activeBgMusicId = '';
                localStorage.setItem('activeBgMusicId', '');
                bgAudioElement.pause();
            }
            renderBgMusicList();
            showToast('Đã xóa nhạc nền!');
        }

        function updateBgVolumePreview(val) {
            bgMusicVolume = val / 100;
            bgAudioElement.volume = bgMusicVolume;
            localStorage.setItem('bgMusicVolume', bgMusicVolume);
            document.getElementById('bgVolumeVal').textContent = val;
        }

        let isPreviewingBg = false;
        function toggleBgMusicPreview() {
            if (bgAudioElement.paused) {
                bgAudioElement.play().then(() => {
                    isPreviewingBg = true;
                    document.getElementById('bgPreviewBtn').textContent = '⏹ Dừng';
                }).catch(e => showToast('Hãy chọn nhạc nền trước!'));
            } else {
                bgAudioElement.pause();
                isPreviewingBg = false;
                document.getElementById('bgPreviewBtn').textContent = '▶ Nghe thử';
            }
        }

        function updateSliderFill(val) {
            const slider = document.getElementById('progressSlider');
            const accentColor = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#f43f5e';
            const cardBorder = getComputedStyle(document.body).getPropertyValue('--card-border').trim() || 'rgba(255,255,255,0.08)';
            slider.style.background = `linear-gradient(to right, ${accentColor} ${val}%, ${cardBorder} ${val}%)`;
        }

        function onSliderInput(val) {
            isUserSeeking = true;
            updateSliderFill(val);
            if (audioElement.duration) {
                const previewTime = (val / 100) * audioElement.duration;
                document.getElementById('currentTimeText').textContent = formatTime(previewTime);
            }
        }

        function onSliderChange(val) {
            if (audioElement.duration) {
                const newTime = (val / 100) * audioElement.duration;
                audioElement.currentTime = newTime;
            }
            isUserSeeking = false;
        }

        function getStoriesFromStorage() {
            try {
                const data = localStorage.getItem(STORIES_KEY);
                if (data) return JSON.parse(data);
            } catch (e) {
                console.error(e);
            }
            return [];
        }

        async function loadStoryAndPlay() {
            const stories = getStoriesFromStorage();
            currentStory = stories.find(s => s.id === currentStoryId);

            if (!currentStory || !currentStory.episodes || currentStory.episodes.length === 0) {
                showToast('Không tìm thấy dữ liệu tập audio!');
                setTimeout(() => window.location.href = 'detail.html', 1000);
                return;
            }

            document.getElementById('playerStoryTitle').textContent = currentStory.name || 'Tiểu thuyết';
            document.getElementById('playerCoverImg').src = currentStory.cover || 'https://placehold.co/150x220/1e293b/cbd5e1?text=No+Cover';

            if (isNaN(currentEpisodeIndex) || currentEpisodeIndex >= currentStory.episodes.length) {
                currentEpisodeIndex = 0;
            }

            loadAndPlayCurrentEpisode();
        }

        async function loadAndPlayCurrentEpisode() {
            const ep = currentStory.episodes[currentEpisodeIndex];
            if (!ep) return;

            document.getElementById('playerEpisodeTitle').textContent = ep.name;

            try {
                const db = await openDB('AudioBookDB_Files');
                const tx = db.transaction('audioBlobs', 'readonly');
                const store = tx.objectStore('audioBlobs');
                const req = store.get(ep.fileId);

                req.onsuccess = function(e) {
                    const audioBlob = e.target.result;
                    if (!audioBlob) {
                        showToast('Không tìm thấy tệp audio trên máy!');
                        return;
                    }

                    const audioUrl = URL.createObjectURL(audioBlob);
                    audioElement.src = audioUrl;
                    audioElement.playbackRate = currentPlaybackSpeed;

                    const savedTime = parseFloat(localStorage.getItem(`history_${currentStoryId}_${currentEpisodeIndex}`) || '0');
                    
                    audioElement.onloadedmetadata = () => {
                        if (savedTime > 5) {
                            pendingHistoryTime = savedTime;
                            document.getElementById('historyBannerText').textContent = `📜 Có lịch sử nghe tại ${formatTime(savedTime)}. Bấm để tiếp tục!`;
                            document.getElementById('historyBanner').style.display = 'flex';
                        }
                    };

                    audioElement.play().then(() => {
                        document.getElementById('playIcon').style.display = 'none';
                        document.getElementById('pauseIcon').style.display = 'block';
                    }).catch(err => {
                        console.error('Autoplay bị chặn:', err);
                        showToast('Bấm nút Play để phát audio.');
                    });
                };
            } catch (err) {
                console.error(err);
                showToast('Lỗi tải tệp âm thanh!');
            }
        }

        function jumpToHistoryTime() {
            if (pendingHistoryTime > 0 && audioElement.duration) {
                audioElement.currentTime = pendingHistoryTime;
                showToast(`Đã nhảy tới vị trí: ${formatTime(pendingHistoryTime)}`);
                document.getElementById('historyBanner').style.display = 'none';
            }
        }

        function savePlaybackHistory(time) {
            if (currentStoryId && !isNaN(currentEpisodeIndex) && time > 2) {
                localStorage.setItem(`history_${currentStoryId}_${currentEpisodeIndex}`, time);
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds <= 0) return "0:00:00";
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            return `${hrs}:${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function togglePlayPause() {
            if (audioElement.paused) {
                audioElement.play();
                document.getElementById('playIcon').style.display = 'none';
                document.getElementById('pauseIcon').style.display = 'block';
            } else {
                audioElement.pause();
                document.getElementById('playIcon').style.display = 'block';
                document.getElementById('pauseIcon').style.display = 'none';
            }
        }

        function skipTime(seconds) {
            if (audioElement.duration) {
                audioElement.currentTime = Math.min(Math.max(audioElement.currentTime + seconds, 0), audioElement.duration);
            }
        }

        function openSpeedModal() {
            closeAllModals();
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('speedModalSheet').classList.add('active');
        }

        function setPlaybackSpeed(speed) {
            currentPlaybackSpeed = speed;
            audioElement.playbackRate = speed;
            localStorage.setItem('globalAudioSpeed', speed);
            document.getElementById('speedLabelBtn').textContent = `Tốc độ: ${speed}x`;
            closeAllModals();
            showToast(`Đã áp dụng tốc độ toàn cục: ${speed}x`);
        }

        function applyCustomSpeed() {
            const val = parseFloat(document.getElementById('customSpeedInput').value);
            if (!isNaN(val) && val >= 0.5 && val <= 4.0) {
                setPlaybackSpeed(val);
            } else {
                showToast('Vui lòng nhập tốc độ từ 0.5 đến 4.0');
            }
        }

        function openSleepTimerModal() {
            closeAllModals();
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('sleepTimerSheet').classList.add('active');
        }

        function startSleepTimer(minutes) {
            if (sleepTimerInterval) clearInterval(sleepTimerInterval);
            sleepTimerRemainingSeconds = minutes * 60;
            
            document.getElementById('sleepTimerBadge').style.display = 'flex';
            updateSleepTimerDisplay();

            sleepTimerInterval = setInterval(() => {
                sleepTimerRemainingSeconds--;
                updateSleepTimerDisplay();

                if (sleepTimerRemainingSeconds <= 0) {
                    clearInterval(sleepTimerInterval);
                    audioElement.pause();
                    document.getElementById('playIcon').style.display = 'block';
                    document.getElementById('pauseIcon').style.display = 'none';
                    document.getElementById('sleepTimerBadge').style.display = 'none';
                    showToast('Đã hẹn giờ tắt audio thành công!');
                }
            }, 1000);

            closeAllModals();
            showToast(`Đã hẹn giờ tắt sau ${minutes} phút`);
        }

        function applyCustomSleepTimer() {
            const mins = parseInt(document.getElementById('customMinutesInput').value, 10);
            if (!isNaN(mins) && mins > 0) {
                startSleepTimer(mins);
            } else {
                showToast('Vui lòng nhập số phút hợp lệ!');
            }
        }

        function cancelSleepTimer() {
            if (sleepTimerInterval) clearInterval(sleepTimerInterval);
            sleepTimerInterval = null;
            document.getElementById('sleepTimerBadge').style.display = 'none';
            closeAllModals();
            showToast('Đã hủy hẹn giờ tắt');
        }

        function updateSleepTimerDisplay() {
            document.getElementById('sleepCountdownText').textContent = formatTime(sleepTimerRemainingSeconds);
        }

        function openPlaylistModal() {
            closeAllModals();
            const container = document.getElementById('playlistContainer');
            const episodes = currentStory.episodes || [];

            container.innerHTML = episodes.map((ep, idx) => `
                <div class="episode-list-item ${idx === currentEpisodeIndex ? 'playing' : ''}" onclick="selectEpisode(${idx})">
                    <span>${idx === currentEpisodeIndex ? '▶ ' : ''}${escapeHtml(ep.name)}</span>
                    <span style="font-size: 11px; opacity: 0.7;">${ep.date || ''}</span>
                </div>
            `).join('');

            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('playlistSheet').classList.add('active');
        }

        function selectEpisode(idx) {
            currentEpisodeIndex = idx;
            localStorage.setItem('currentEpisodeIndex', idx);
            document.getElementById('historyBanner').style.display = 'none';
            closeAllModals();
            loadAndPlayCurrentEpisode();
        }

        // Tùy chỉnh chọn và tinh chỉnh từng phần tử / cục giao diện
        let isCustomizing = false;
        let selectedElementId = null;
        let elementConfigs = JSON.parse(localStorage.getItem('playerElementConfigs') || '{}');
        // Cấu trúc config: { id: { y: 0, scale: 1 } }

        function toggleLayoutCustomizer() {
            isCustomizing = !isCustomizing;
            const btn = document.getElementById('layoutToggleBtn');
            
            if (isCustomizing) {
                document.body.classList.add('customizing-layout');
                btn.classList.add('active-custom');
                showToast('Đang bật chế độ chỉnh sửa. Bấm vào khoảng trống hoặc thành phần bất kỳ để tùy chỉnh!');
                setupElementClickListeners();
            } else {
                document.body.classList.remove('customizing-layout');
                btn.classList.remove('active-custom');
                clearElementSelection();
                showToast('Đã lưu tùy chỉnh giao diện thành công!');
            }
        }

        function setupElementClickListeners() {
            // Các module lớn và phần tử con
            const elements = document.querySelectorAll('.player-module, #subElementCover, #subElementControls, #subElementFeatures');
            elements.forEach(el => {
                el.onclick = (e) => {
                    if (!isCustomizing) return;
                    e.stopPropagation();
                    selectElement(el);
                };
            });
        }

        function selectElement(el) {
            clearElementSelection();
            selectedElementId = el.id;
            el.classList.add(el.classList.contains('player-module') ? 'selected-element' : 'selected-sub-element');
            const name = el.getAttribute('data-name') || 'Phần tử';
            document.getElementById('selectedElementName').textContent = name;
        }

        function clearElementSelection() {
            document.querySelectorAll('.selected-element, .selected-sub-element').forEach(el => {
                el.classList.remove('selected-element', 'selected-sub-element');
            });
            selectedElementId = null;
            document.getElementById('selectedElementName').textContent = 'Chưa chọn ô';
        }

        function adjustSelectedElement(action) {
            if (!selectedElementId) {
                showToast('Vui lòng chạm chọn một ô hoặc phần tử trước!');
                return;
            }

            if (!elementConfigs[selectedElementId]) {
                elementConfigs[selectedElementId] = { y: 0, scale: 1 };
            }

            const cfg = elementConfigs[selectedElementId];
            if (action === 'up') cfg.y -= 8;
            if (action === 'down') cfg.y += 8;
            if (action === 'zoomIn') cfg.scale = Math.min(cfg.scale + 0.05, 1.4);
            if (action === 'zoomOut') cfg.scale = Math.max(cfg.scale - 0.05, 0.7);

            localStorage.setItem('playerElementConfigs', JSON.stringify(elementConfigs));
            applyElementTransforms();
        }

        function applyElementTransforms() {
            for (const id in elementConfigs) {
                const el = document.getElementById(id);
                if (el) {
                    const cfg = elementConfigs[id];
                    el.style.transform = `translateY(${cfg.y}px) scale(${cfg.scale})`;
                }
            }
        }

        function loadElementTransforms() {
            applyElementTransforms();
        }

        function closeAllModals() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.querySelectorAll('.bottom-sheet').forEach(sheet => sheet.classList.remove('active'));
        }

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
